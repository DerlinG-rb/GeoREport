<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoReport · Institución simulada</title><link rel="stylesheet" href="/style.css"><script defer src="/portal.js"></script></head>
<body><header><strong>GeoReport / Recepción institucional</strong><h1>Institución simulada — demostración académica</h1><p>No representa a ningún organismo real.</p></header><main>
<form id="access"><h2>Acceso de demostración</h2><label for="token">Clave de la institución</label><input id="token" type="password" required autocomplete="off"><button>Entrar</button></form>
<section id="workspace" hidden><label for="institution">Institución destinataria</label><select id="institution"></select><button id="refresh">Actualizar</button><button id="logout">Cerrar sesión</button><div class="columns"><section><h2>Reportes recibidos</h2><div id="reports"></div></section><section id="detail" aria-label="Detalle del reporte"></section></div></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
